# Fly.io configuration for Cardinal Foundation Services.
# The app name is set by `fly launch` / `fly apps create`; if you pick a
# different name, update it here too.
app = "cardinalfoundationservices"
primary_region = "dfw"   # Dallas — closest region to the business + customers

[env]
  # Lead writes + exports replay onto this machine so the JSONL stays
  # whole on one volume. Update if the machine is ever replaced.
  PRIMARY_LEADS_MACHINE = "e82d1703f75928"

[[mounts]]
  source = "leads_data"
  destination = "/data"

[build]
  [build.args]
    NEXT_PUBLIC_GA4_ID = "G-RZD0RB74TN"
    NEXT_PUBLIC_GADS_CONVERSION_ID = "AW-986491398"
    NEXT_PUBLIC_HOTJAR_ID = "6767089"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
